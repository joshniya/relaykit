# Copy to <project>/.relaykit/config.toml (or ~/.relaykit/config.toml for defaults everywhere).

[relay]
agent = "claude"
handoff_pct = 35
hard_pct = 45
max_hours = 12
max_sessions = 40

[agents.claude]
model = "claude-opus-5-5"
effort = "high"
handoff_tokens_max = 300000     # 1M-token windows: hand off long before 35%
confirmed = true

[agents.codex]
model = "gpt-5.6-sol"
effort = "high"
confirmed = true

[failover]
enabled = true
chain = ["claude", "codex"]

[git]
mode = "worktree"

[notify]
desktop = true
ntfy_topic = ""          # e.g. "my-relays-8f2k" (install the ntfy app and subscribe to it)
webhook_url = ""         # a Discord or Slack webhook URL
