name: release
# Publishes to PyPI when a version tag (v*) is pushed, using PyPI "trusted publishing":
# on pypi.org -> Publishing -> add a pending publisher: owner Jishwuh, repo relaykit,
# workflow release.yml, environment pypi. No API token is stored anywhere.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_wheel.py
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
