name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyflakes build
      - run: python -m pyflakes src tests
      - run: python tools/sync_assets.py --check
      - run: python -m pytest -q
      - name: package builds and includes its assets
        run: |
          python -m build
          python tools/check_wheel.py
